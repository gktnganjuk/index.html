<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#245b4a"><title>Ranking Poin — Rumah Belajar Wiyata</title>
<style>
:root{--brand:#245b4a;--ink:#172033;--muted:#667085;--line:#e4e7ec;--bg:#f5f7f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 14px 40px}.hero{background:var(--brand);color:white;padding:25px 22px;border-radius:18px}.hero h1{font-size:clamp(22px,5vw,30px);margin:0 0 6px}.hero p{margin:0;opacity:.9}.meta{font-size:13px;margin-top:12px;opacity:.85}.tools{display:flex;gap:8px;margin:16px 0}.tools input{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}.tools button{border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:white;font:inherit}.card{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.pos{width:34px;height:34px;display:grid;place-items:center;background:#e8eeeb;border-radius:50%;font-weight:800}.name{font-weight:700}.grade{font-size:13px;color:var(--muted)}.points{font-weight:800;color:var(--brand);white-space:nowrap}.msg{padding:24px;text-align:center;color:var(--muted)}.foot{color:var(--muted);font-size:12px;margin-top:14px;text-align:center}@media(max-width:430px){.wrap{padding:12px}.hero{padding:20px 17px}.row{grid-template-columns:36px 1fr auto;gap:8px;padding:12px 10px}.pos{width:30px;height:30px}.points{font-size:14px}}
</style></head><body><main class="wrap"><section class="hero"><h1>Ranking Poin Siswa</h1><p>Rumah Belajar Wiyata</p><div id="updated" class="meta">Memuat data terbaru…</div></section><div class="tools"><input id="search" placeholder="Cari nama siswa atau kelas…" oninput="render()"><button onclick="loadRanking()">Perbarui</button></div><section id="list" class="card"><div class="msg">Mengambil ranking terbaru…</div></section><div class="foot">Poin mengikuti data terbaru yang tersedia. Halaman ini hanya menampilkan nama, kelas, dan total poin.</div></main>
<script>
// Ganti dengan URL /exec dari deployment Apps Script yang aktif.
const RANKING_API_URL = 'https://script.google.com/macros/s/AKfycbwxhoH-YKDrlU6YKvzRsj5Ci9MVK2FdxwVi2HVisp-Cgmx_m4nMslECoaJl_TcAvZRFGw/exec';
let rows=[];
function loadRanking(){const list=document.getElementById('list');if(RANKING_API_URL.includes('GANTI_DENGAN')){list.innerHTML='<div class="msg">Admin belum mengatur URL sumber ranking.</div>';return;}list.innerHTML='<div class="msg">Memuat data terbaru…</div>';const old=document.getElementById('jsonpScript');if(old)old.remove();const cb='rwRankingCb_'+Date.now();window[cb]=data=>{try{rows=Array.isArray(data.rows)?data.rows:[];document.getElementById('updated').textContent='Diperbarui: '+new Date(data.updatedAt||Date.now()).toLocaleString('id-ID');render();}catch(e){list.innerHTML='<div class="msg">Data ranking tidak dapat dibaca.</div>';}finally{delete window[cb];const s=document.getElementById('jsonpScript');if(s)s.remove();}};const s=document.createElement('script');s.id='jsonpScript';s.onerror=()=>{list.innerHTML='<div class="msg">Gagal mengambil data. Periksa deployment Apps Script dan koneksi internet.</div>';delete window[cb];s.remove();};s.src=RANKING_API_URL+(RANKING_API_URL.includes('?')?'&':'?')+'api=ranking&callback='+cb;document.body.appendChild(s);}
function render(){const q=document.getElementById('search').value.trim().toLocaleLowerCase('id');const filtered=rows.filter(s=>(String(s.Nama_Siswa||'')+' '+String(s.Kelas||'')).toLocaleLowerCase('id').includes(q));const list=document.getElementById('list');if(!filtered.length){list.innerHTML='<div class="msg">'+(rows.length?'Tidak ada siswa yang cocok.':'Belum ada data ranking.')+'</div>';return;}list.innerHTML=filtered.map((s,i)=>'<div class="row"><div class="pos">'+(i+1)+'</div><div><div class="name">'+esc(s.Nama_Siswa||'Siswa')+'</div><div class="grade">Kelas '+esc(s.Kelas||'—')+'</div></div><div class="points">'+esc(s.Total_Poin??0)+' poin</div></div>').join('');}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}loadRanking();
</script></body></html>
